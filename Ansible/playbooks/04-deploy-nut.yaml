- name: Deploy SRV-NUT containers
  hosts: SRV-NUT
  become: true
  gather_facts: false

  vars:
    container_directory: "/home/{{ ansible_user }}/SRV-NUT"
    repository_base_url: "https://raw.githubusercontent.com/marioqqq/HoneyLab/main/SRV-NUT"

  tasks:
    - name: Create SRV-NUT directory
      ansible.builtin.file:
        path: "{{ container_directory }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Download Docker Compose file
      ansible.builtin.get_url:
        url: "{{ repository_base_url }}/docker-compose.yaml"
        dest: "{{ container_directory }}/docker-compose.yaml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Download environment file
      ansible.builtin.get_url:
        url: "{{ repository_base_url }}/.env"
        dest: "{{ container_directory }}/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Download upswake directory
      ansible.builtin.subversion:
        repo: "{{ repository_base_url }}/upswake"
        dest: "{{ container_directory }}/upswake"

    - name: Set ownership for upswake directory
      ansible.builtin.file:
        path: "{{ container_directory }}/upswake"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: true