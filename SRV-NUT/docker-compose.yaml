services:
  # Common
  beszel-agent:
    container_name: beszel-agent
    image: henrygd/beszel-agent:latest
    environment:
      LISTEN: 45876
      KEY: # get from Dashboard
      TOKEN: # get from Dashboard
      HUB_URL: # get from Dashboard
      PRIMARY_SENSOR: cpu_thermal
    volumes:
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - /var/run/systemd/private:/var/run/systemd/private:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - ./beszel_agent:/var/lib/beszel-agent
    privileged: true
    security_opt:
      - apparmor:unconfined
    network_mode: host
    restart: unless-stopped

  portainer-agent:
    container_name: portainer-agent
    image: portainer/agent:latest
    ports:
      - 9001:9001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - nut
    restart: unless-stopped

  watchtower:
    container_name: watchtower
    image: nickfedor/watchtower:latest
    environment:
      - TZ=Europe/Bratislava
      - WATCHTOWER_MONITOR_ONLY=false
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 6 0 * * 0
      - WATCHTOWER_NOTIFICATION_URL=gotify://${GOTIFY_URL}/${GOTIFY_TOKEN}
      - WATCHTOWER_NO_STARTUP_MESSAGE=true
      - WATCHTOWER_NOTIFICATIONS_HOSTNAME=SRV-NUT
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - nut
    restart: unless-stopped

  # Specific
  adguard_home:
    container_name: adguard_home
    image: adguard/adguardhome:latest
    ports:
      - ${IP}:53:53/tcp
      - ${IP}:53:53/udp
      - 3000:3000
    volumes:
      - ./adguard_home/work:/opt/adguardhome/work
      - ./adguard_home/conf:/opt/adguardhome/conf
    networks:
      - nut
    restart: unless-stopped

  nutify:
    container_name: Nutify
    image: dartsteven/nutify:arm64-latest
    ports:
      - 3493:3493
      - 5050:5050
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - UDEV=1
    volumes:
      - ./nutify/logs:/app/nutify/logs
      - ./nutify/instance:/app/nutify/instance
      - ./nutify/ssl:/app/ssl
      - ./nutify/etc/nut:/etc/nut
      - /dev:/dev:rw              # Full /dev access improves hotplug handling
      - /run/udev:/run/udev:ro    # Access to udev events
    devices:
      - /dev/bus/usb:/dev/bus/usb:rwm
    device_cgroup_rules:
      - 'c 189:* rwm'
    privileged: true
    user: root
    cap_add:
      - SYS_ADMIN
      - SYS_RAWIO
      - MKNOD
    networks:
      - nut
    restart: always

  tailscale:
    container_name: tailscale
    image: tailscale/tailscale:latest
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--login-server=${LOGIN_SERVER} --advertise-routes ${ADVERTISE_ROUTES} --reset
    volumes:
      - ./tailscale/data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    hostname: nut
    networks:
      - nut
    restart: unless-stopped

  upsnap:
    container_name: upsnap
    image: ghcr.io/seriousm4x/upsnap:latest # images are also available on docker hub: seriousm4x/upsnap:5
    environment:
      - TZ=Europe/Bratislava
      - UPSNAP_INTERVAL=*/10 * * * * *
      - UPSNAP_SCAN_RANGE=${RANGE}   
    volumes:
      - ./upsnap:/app/pb_data
    network_mode: host
    restart: unless-stopped

  upswake:
    container_name: upswake
    image: thedarthmole/upswake:latest
    environment:
      - TZ=Europe/Bratislava
    volumes:
      - ./upswake/config.yaml:/config.yaml:ro
      - ./upswake/rules:/rules:ro
      - ./upswake/cache:/.cache
    user: 1000:1000
    command: ["serve"]
    cap_drop: [ all ]
    security_opt: [no-new-privileges:true]
    depends_on:
      - nutify
    network_mode: host
    restart: unless-stopped

networks:
  nut:
    name: nut
    driver: bridge