services:
  # Common
  beszel-agent:
    container_name: beszel-agent
    image: henrygd/beszel-agent:latest
    environment:
      LISTEN: 45876
      KEY: # get from Dashboard
      TOKEN: # get from Dashboard
      HUB_URL: # get from Dashboard
    volumes:
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - /var/run/systemd/private:/var/run/systemd/private:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - ./beszel_agent:/var/lib/beszel-agent
    privileged: true
    security_opt:
      - apparmor:unconfined
    network_mode: host
    restart: unless-stopped

  watchtower:
    container_name: watchtower
    image: nickfedor/watchtower:latest
    environment:
      - TZ=Europe/Bratislava
      - WATCHTOWER_MONITOR_ONLY=false
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 6 0 * * 0
      - WATCHTOWER_NOTIFICATION_URL=gotify://${GOTIFY_URL}/${GOTIFY_TOKEN}
      - WATCHTOWER_NO_STARTUP_MESSAGE=true
      - WATCHTOWER_NOTIFICATIONS_HOSTNAME=SRV-Management
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - management
    restart: unless-stopped

  # Specific
  adguard_home:
    container_name: adguard_home
    image: adguard/adguardhome:latest
    ports:
      - ${IP}:53:53/tcp
      - ${IP}:53:53/udp
      - 3000:3000
    volumes:
      - ./adguard_home/work:/opt/adguardhome/work
      - ./adguard_home/conf:/opt/adguardhome/conf
    networks:
      - management
    restart: unless-stopped

  beszel:
    container_name: beszel
    image: henrygd/beszel:latest
    ports:
      - 8090:8090
    environment:
      - APP_URL=${APP_URL}
    volumes:
      - ./beszel:/beszel_data
    networks:
      - management
    restart: unless-stopped

  linux_update_dashboard:
    container_name: linux_update_dashboard
    image: ghcr.io/theduffman85/linux-update-dashboard:latest
    ports:
      - 3001:3001
    environment:
      - LUDASH_ENCRYPTION_KEY=${LUDASH_ENCRYPTION_KEY}
      - LUDASH_DB_PATH=/data/dashboard.db
      - LUDASH_BASE_URL=${LUDASH_BASE_URL}
      - LUDASH_TRUST_PROXY=true
      - NODE_ENV=production
    volumes:
      - ./linux_update_dashboard:/data
    networks:
      - management
    restart: unless-stopped

  netalertx:
    container_name: netalertx
    image: ghcr.io/netalertx/netalertx:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bratislava
      - LISTEN_ADDR=0.0.0.0
      - PORT=20211
      - GRAPHQL_PORT=20212
    volumes:
      - ./netalertx:/data
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1700,rw,noexec,nosuid,nodev,async,noatime,nodiratime
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
    network_mode: host
    restart: unless-stopped

  nginx_proxy_manager:
    container_name: nginx_proxy_manager
    image: jc21/nginx-proxy-manager:latest
    ports:
      - 80:80
      - 81:81
      - 443:443
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bratislava
    volumes:
      - ./nginx_proxy_manager/data:/data
      - ./nginx_proxy_manager/letsencrypt:/etc/letsencrypt
    networks:
      - management
    restart: unless-stopped

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    ports:
      - 9443:9443
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bratislava
    volumes:
      - portainer:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - management
    restart: unless-stopped

  uptime_kuma:
    container_name: uptime_kuma
    image: louislam/uptime-kuma:2
    volumes:
      - ./uptime_kuma:/app/data
    ports:
      - 3002:3001
    networks:
      - management
    dns:
      - 1.1.1.1
      - 9.9.9.9
      - 8.8.8.8
    restart: unless-stopped

networks:
  management:
    name: management
    driver: bridge

volumes:
  portainer:
    name: portainer
    driver: local
