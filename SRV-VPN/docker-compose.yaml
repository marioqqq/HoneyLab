services:
  # Common
  beszel-agent:
    container_name: beszel-agent
    image: henrygd/beszel-agent:latest
    environment:
      LISTEN: 45876
      KEY: # get from Dashboard
      TOKEN: # get from Dashboard
      HUB_URL: # get from Dashboard
    volumes:
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - /var/run/systemd/private:/var/run/systemd/private:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - ./beszel_agent:/var/lib/beszel-agent
    privileged: true
    security_opt:
      - apparmor:unconfined
    network_mode: host
    restart: unless-stopped

  portainer-agent:
    container_name: portainer-agent
    image: portainer/agent:latest
    ports:
      - 9001:9001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - vpn
    restart: unless-stopped

  watchtower:
    container_name: watchtower
    image: nickfedor/watchtower:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bratislava
      - WATCHTOWER_MONITOR_ONLY=false
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 6 0 * * 0
      - WATCHTOWER_NOTIFICATIONS=gotify
      - WATCHTOWER_NOTIFICATION_GOTIFY_URL=${GOTIFY_URL}
      - WATCHTOWER_NOTIFICATION_GOTIFY_TOKEN=${GOTIFY_TOKEN}
      - WATCHTOWER_NOTIFICATIONS_HOSTNAME=SRV-VPN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - vpn
    restart: unless-stopped

#Specific
  tailscale:
    container_name: tailscale
    image: tailscale/tailscale:latest
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY} # Comment after initial run
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--login-server=${LOGIN_SERVER} --advertise-routes ${ADVERTISE_ROUTES} --restart
    volumes:
      - ./tailscale/data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    networks:
      - vpn
    restart: unless-stopped

networks:
  vpn:
    name: vpn
    driver: bridge
