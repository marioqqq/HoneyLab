services:
  # Common
  beszel-agent:
    container_name: beszel-agent
    image: henrygd/beszel-agent-nvidia:latest
    environment:
      LISTEN: 45876
      KEY: # get from Dashboard
      TOKEN: # get from Dashboard
      HUB_URL: # get from Dashboard
    volumes:
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - /var/run/systemd/private:/var/run/systemd/private:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - ./beszel_agent:/var/lib/beszel-agent
    deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities:
              - utility
    privileged: true
    security_opt:
      - apparmor:unconfined
    network_mode: host
    restart: unless-stopped

  portainer-agent:
    container_name: portainer-agent
    image: portainer/agent:latest
    ports:
      - 9001:9001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - media
    restart: unless-stopped

  watchtower:
    container_name: watchtower
    image: nickfedor/watchtower:latest
    environment:
      - TZ=Europe/Bratislava
      - WATCHTOWER_MONITOR_ONLY=false
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 6 0 * * 0
      - WATCHTOWER_NOTIFICATION_URL=gotify://${GOTIFY_URL}/${GOTIFY_TOKEN}
      - WATCHTOWER_NO_STARTUP_MESSAGE=true
      - WATCHTOWER_NOTIFICATIONS_HOSTNAME=SRV-Media
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - media
    restart: unless-stopped

  # Specific
  immich:
    container_name: immich
    image: ghcr.io/imagegenius/immich:cuda # NVIDIA
    # image: ghcr.io/imagegenius/immich:openvino # INTEL
    ports:
      - 8080:8080
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bratislava
      - DB_HOSTNAME=postgres
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME}
      - REDIS_HOSTNAME=redis
      - DB_PORT=5432
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MACHINE_LEARNING_HOST=0.0.0.0
      - MACHINE_LEARNING_PORT=3003
      - MACHINE_LEARNING_WORKERS=1
      - MACHINE_LEARNING_WORKER_TIMEOUT=120
      - NVIDIA_VISIBLE_DEVICES=all # NVIDIA
      - NVIDIA_DRIVER_CAPABILITIES=all # NVIDIA
    volumes:
      - ./immich/config:/config
      - ./immich/libraries:/libraries
      - photos:/photos
    # devices:
    #   - /dev/dri # INTEL
    # device_cgroup_rules:
    #   - c 189:* rmw # INTEL
    depends_on:
      - postgres
      - redis
    runtime: nvidia # NVIDIA
    networks:
      - media
    restart: unless-stopped

  plex:
    container_name: plex
    image: lscr.io/linuxserver/plex:latest
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Europe/Bratislava
      - VERSION=docker
      - NVIDIA_VISIBLE_DEVICES=all # NVIDIA
      - NVIDIA_DRIVER_CAPABILITIES=all # NVIDIA
    volumes:
      - ./plex/config:/config
      - movies:/movies
      - movies-czsk:/movies-czsk # remove if you don't have a czech/slovak movies share
      - music:/music
    # devices: # INTEL
    #   - /dev/dri:/dev/dri # INTEL
    runtime: nvidia # NVIDIA
    network_mode: host
    restart: unless-stopped

  postgres:
    container_name: postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bratislava
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE_NAME}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    networks:
      - media
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:latest
    volumes:
      - ./redis/dаta:/data
    entrypoint: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - media
    restart: unless-stopped

networks:
  media:
    name: media
    driver: bridge

volumes:
  movies:
    name: movies
    driver: local
    driver_opts:
      type: nfs
      o: addr=${IP},rw,nolock,soft,nfsvers=4
      device: ${MOVIES}
  movies-czsk: # remove if you don't have a czech/slovak movies share
    name: movies-czsk
    driver: local
    driver_opts:
      type: nfs
      o: addr=${IP},rw,nolock,soft,nfsvers=4
      device: ${MOVIES_CZSK}
  music:
    name: music
    driver: local
    driver_opts:
      type: nfs
      o: addr=${IP},rw,nolock,soft,nfsvers=4
      device: ${MUSIC}
  photos:
    name: photos
    driver: local
    driver_opts:
      type: nfs
      o: addr=${IP},rw,nolock,soft,nfsvers=4
      device: ${PHOTOS}
