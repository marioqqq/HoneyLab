- name: Bootstrap Ubuntu servers
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Update package cache and upgrade packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true

    - name: Set timezone
      community.general.timezone:
        name: Europe/Bratislava

    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Install common packages
      ansible.builtin.apt:
        name:
          - nano
        state: present